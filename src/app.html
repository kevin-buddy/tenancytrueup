<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
		<script src="https://cdn.tailwindcss.com"></script>
		<script>
			tailwind.config = {
				theme: {
					extend: {
						fontFamily: {
							sans: ['Inter', 'sans-serif'],
						},
						colors: {
							brand: {
								50: '#fff7ed',
								100: '#ffedd5',
								200: '#fed7aa',
								300: '#fdba74',
								400: '#fb923c',
								500: '#f97316', // Enterprise Orange (Primary)
								600: '#ea580c', // Darker Orange for hover states
								700: '#c2410c',
								800: '#9a3412',
								900: '#7c2d12', // Very dark orange for text headers
								accent: '#111827' // Dark slate for contrast
							}
						},
						backgroundImage: {
							'gradient-radial': 'radial-gradient(var(--tw-gradient-stops))',
							'hero-pattern': "url('data:image/svg+xml,%3Csvg width=\"60\" height=\"60\" viewBox=\"0 0 60 60\" xmlns=\"http://www.w3.org/2000/svg\"%3E%3Cg fill=\"none\" fill-rule=\"evenodd\"%3E%3Cg fill=\"%23f97316\" fill-opacity=\"0.04\"%3E%3Cpath d=\"M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z\"/%3E%3C/g%3E%3C/g%3E%3C/svg%3E')",
						}
					}
				}
			}
		</script>
		<style>
			/* Custom styles for animations and specific UI tweaks */
			.glass-panel {
				background: rgba(255, 255, 255, 0.7);
				backdrop-filter: blur(10px);
				border: 1px solid rgba(0, 0, 0, 0.05);
			}
			
			.mock-dashboard-shadow {
				box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.1), 0 0 0 1px rgba(0,0,0,0.05);
			}

			/* Custom scrollbar to match the clean aesthetic */
			::-webkit-scrollbar { width: 6px; height: 6px; }
			::-webkit-scrollbar-track { background: transparent; }
			::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
			::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
		</style>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
